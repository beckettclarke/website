<main class="page case" data-title="Crescent Outreach" data-tint="#006e51">
  <header class="p-head wrap">
    <nav nodrag class="crumbs label" aria-label="Breadcrumb" data-reveal>
      <a href="/#work">Work</a><span class="sep">/</span><span>Crescent Outreach</span>
    </nav>
    <div class="p-title" data-reveal style="--d:1">
      <img nodrag class="p-logo" src="icons/csoutreach.png" alt="">
      <h1 class="display">Crescent School Outreach</h1>
    </div>
  </header>

  <section class="c-sec wrap">
    <div class="c-sec-head" data-reveal>
      <h2 class="c-title">Mark &amp; colour</h2>
    </div>
    <div class="mark-row">
      <div class="mark-tile" style="--mark-bg:#edecdf" data-reveal>
        <img src="icons/csoutreach.png" alt="Crescent School Outreach logo">
      </div>
      <div class="swatches" data-reveal style="--d:1">
        <div class="swatch" style="--sw:#006e51"><b>Green</b><span>#006E51</span></div>
        <div class="swatch" style="--sw:#edecdf;--sw-fg:#0d0c0b"><b>Light</b><span>#EDECDF</span></div>
        <div class="swatch" style="--sw:#000000"><b>Dark</b><span>#000000</span></div>
      </div>
    </div>
  </section>

  <section class="c-sec wrap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;800&display=swap">
    <div class="c-sec-head" data-reveal>
      <h2 class="c-title">Type</h2>
    </div>
    <div class="type" data-reveal>
      <div class="type-row" style="font-family: 'DIN Black', sans-serif;">
        <span class="type-name">DIN Black</span>
        <span class="type-sample" aria-hidden="true">Aa Bb Cc Dd Ee Ff Gg</span>
      </div>
      <div class="type-row" style="font-family: 'Libre Franklin', sans-serif; font-weight: 800;">
        <span class="type-name">Franklin Gothic</span>
        <span class="type-sample" aria-hidden="true">Aa Bb Cc Dd Ee Ff Gg</span>
      </div>
    </div>
    <div class="type-scale" data-reveal>
      <div class="ts-row"><span class="label">Heading 1</span><span class="ts ts-1" style="font-family: 'DIN Black', sans-serif;">Heading 1</span></div>
      <div class="ts-row"><span class="label">Heading 2</span><span class="ts ts-2" style="font-family: 'DIN Black', sans-serif;">Heading 2</span></div>
      <div class="ts-row"><span class="label">Heading 3</span><span class="ts ts-3" style="font-family: 'DIN Black', sans-serif;">Heading 3</span></div>
      <div class="ts-row"><span class="label">Content</span><span class="ts ts-4" style="font-family: 'Libre Franklin', sans-serif; font-weight: 600;">Content</span></div>
    </div>
  </section>

  <section class="c-sec wrap">
    <div class="c-sec-head" data-reveal>
      <h2 class="c-title">Guidelines</h2>
    </div>
    <div class="frame paper" data-reveal>
      <img largeview loading="lazy" width="1285" height="1544" src="https://cdn.beckettclarke.ca/site/img/clients/csoutreach_guidelines.png" alt="Crescent School Outreach brand guidelines sheet">
    </div>
  </section>

  <div class="wrap">
    <a class="next" href="/clients/apollozhang/" data-reveal>
      <span class="label"><span>Next project</span><span>04 / 04</span></span>
      <span class="next-name"><img src="icons/apollozhang.png" alt="">Apollo Zhang<span class="arr">→</span></span>
    </a>
  </div>
</main>
