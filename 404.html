<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark">
  <title>Beckett Clarke</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0a0a0b; }
  </style>
  <script>
    /* GitHub Pages has no rewrite rules, so any clean URL lands here.
       Hand the path to the SPA router as a route hash; router.js
       restores the real URL with replaceState on boot. */
    (function () {
      var path = location.pathname.replace(/^\/+/, '');
      location.replace('/#/' + path + location.search + location.hash);
    })();
  </script>
</head>
<body></body>
</html>
